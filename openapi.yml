        max_cents:
          type: integer
          description: Highest per-tier contribution in cents.
      required:
      - max_cents
      - min_cents
    _ContributionStrategy:
      type: object
      description: |-
        How the plan year prices contributions: exactly one collection is populated, determined by the
        plan year's ``family`` (ICHRA vs tier-priced).
      properties:
        ichra_contribution_classes:
          type: array
          items:
            $ref: '#/components/schemas/_IchraContributionClass'
          description: ICHRA contribution classes; empty for tier-priced benefits.
        contribution_tiers:
          type: array
          items:
            $ref: '#/components/schemas/_ContributionTier'
          description: Coverage tiers and their costs; empty for ICHRA benefits.
      required:
      - contribution_tiers
      - ichra_contribution_classes
    _ContributionTier:
      type: object
      description: |-
        One non-ICHRA coverage tier, mirroring the internal configuration ``CompanyBenefitPlanTierCostDTO``
        minus the tier-cost id, ``pepm`` and ``pepm_per_dependent``; ``benefit_plan_id`` is the prefixed
        ``bpln_*`` form rather than a raw UUID.
      properties:
        benefit_plan_id:
          type: string
          description: Prefixed benefit-plan identifier (`bpln_*`).
        benefit_plan_name:
          type: string
          description: Benefit plan name.
        benefit_plan_tier_name:
          type: string
          description: Coverage-tier name.
        coverage_tier:
          allOf:
          - $ref: '#/components/schemas/CoverageTier'
          description: |-
            Coverage-tier code for this tier.

            * `Unspecified` - Unspecified
            * `EE` - Ee
            * `ES` - Es
            * `EC` - Ec
            * `EF` - Ef
        cost:
          type: integer
          description: Monthly employee deduction in cents.
        cost_per_dependent:
          type: integer
          description: Monthly employee deduction per dependent, in cents.
        dependents_required_in:
          type: boolean
          description: Whether dependents are required for this tier.
        spouse_required_in:
          type: boolean
          description: Whether a spouse is required for this tier.
      required:
      - benefit_plan_id
      - benefit_plan_name
      - benefit_plan_tier_name
      - cost
      - cost_per_dependent
      - coverage_tier
      - dependents_required_in
      - spouse_required_in
    _EligibilityPolicy:
      type: object
      description: |-
        The plan year's active eligibility policy. Mirrors the internal ``PlanYearEligibilityPolicyDTO``
        but exposes only the public subset (no raw ids, ``active_in``, or timestamps).
      properties:
        waiting_period:
          allOf:
          - $ref: '#/components/schemas/WaitingPeriod'
          nullable: true
          description: |-
            When coverage starts for a newly-eligible member, or null.

            * `FIRST_OF_FOLLOWING_MONTH` - First Of Following Month
            * `THIRTY_DAYS` - Thirty Days
            * `SIXTY_DAYS` - Sixty Days
        termination_rule:
          allOf:
          - $ref: '#/components/schemas/TerminationRule'
          description: |-
            When coverage ends after a member becomes ineligible.

            * `END_OF_N_MONTHS` - End Of N Months
            * `END_OF_PLAN_YEAR` - End Of Plan Year
        termination_n_months:
          type: integer
          nullable: true
          description: Months of continued coverage; set only when `termination_rule` is `END_OF_N_MONTHS`.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/_EligibilityPolicyRule'
          description: Eligibility rules; never empty for a valid policy.
      required:
      - rules
      - termination_n_months
      - termination_rule
      - waiting_period
    _EligibilityPolicyRule:
      type: object
      description: |-
        One eligibility rule — the workforce slice it makes eligible. Mirrors the internal
        ``PlanYearEligibilityPolicyRuleDTO`` minus the raw ids and timestamps.
      properties:
        employee_class:
          allOf:
          - $ref: '#/components/schemas/EligibilityRuleEmployeeClass'
          description: |-
            Employee-class matcher (`All` for any).

            * `Full Time` - Full Time
            * `Part Time` - Part Time
            * `Temporary` - Temporary
            * `Intern` - Intern
            * `Seasonal` - Seasonal
            * `Individual Contractor` - Individual Contractor
            * `All` - All
        compensation_type:
          allOf:
          - $ref: '#/components/schemas/EligibilityRuleCompensationType'
          description: |-
            Compensation matcher (`All` for any).

            * `Salary` - Salary
            * `Hourly` - Hourly
            * `All` - All
        eligible_geographical_location:
          allOf:
          - $ref: '#/components/schemas/_EligibleGeographicalLocation'
          description: Geographic matcher.
      required:
      - compensation_type
      - eligible_geographical_location
      - employee_class
    _EligibleGeographicalLocation:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/_EligibleGeographicalLocationType'
          description: |-
