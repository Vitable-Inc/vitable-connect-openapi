        provider:
          type: string
          description: Id of the HRIS/payroll provider the employer is connected to (e.g. `paylocity`).
        provider_label:
          type: string
          description: Display name of that provider (e.g. `Paylocity`).
        status:
          type: string
          description: Connection status reported by the integration.
      required:
      - provider
      - provider_label
      - status
    _IchraContributionClass:
      type: object
      description: |-
        One ICHRA contribution class, mirroring the internal configuration endpoint's
        ``IchraContributionClassConfigurationEntitySerializer`` field-for-field. Two deliberate
        differences for the public surface: the identifier is the opaque prefixed ``iccl_*`` form rather
        than a raw UUID, and the matcher choices come from the domain enums rather than the model's.
      properties:
        contribution_class_id:
          type: string
          description: Prefixed contribution-class identifier (`iccl_*`).
        amount_in_cents:
          type: integer
          description: Monthly allowance in cents.
        employment:
          allOf:
          - $ref: '#/components/schemas/ContributionClassEmployment'
          description: |-
            Employment matcher.

            * `Unspecified` - Unspecified
            * `Full Time` - Full Time
            * `Part Time` - Part Time
            * `Temporary` - Temporary
            * `Seasonal` - Seasonal
        compensation:
          allOf:
          - $ref: '#/components/schemas/ContributionClassCompensation'
          description: |-
            Compensation matcher.

            * `Unspecified` - Unspecified
            * `Salary` - Salary
            * `Hourly` - Hourly
        location:
          allOf:
          - $ref: '#/components/schemas/ContributionClassLocation'
          description: |-
            Location matcher type.

            * `Unspecified` - Unspecified
            * `State` - State
        location_value:
          type: string
          nullable: true
          description: Location matcher value (CSV of state codes), or null.
        family_status:
          allOf:
          - $ref: '#/components/schemas/CoverageTier'
          description: |-
            Family-status matcher.

            * `Unspecified` - Unspecified
            * `EE` - Ee
            * `ES` - Es
            * `EC` - Ec
            * `EF` - Ef
        min_age:
          type: integer
          nullable: true
          description: Age-band lower bound, or null.
        max_age:
          type: integer
          nullable: true
          description: Age-band upper bound, or null.
      required:
      - amount_in_cents
      - compensation
      - contribution_class_id
      - employment
      - family_status
      - location
      - location_value
      - max_age
      - min_age
    _InvoicesCursorPagination:
      type: object
      properties:
        next_offset:
          type: string
          nullable: true
          description: Opaque JSON-encoded cursor for the next page; null when there are no more pages.
      required:
      - next_offset
    EmployeeId:
      type: string
      example: empl_abc123def456
      description: Unique employee identifier (empl_*)
    Limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
      example: 20
      description: 'Items per page (default: 20, max: 100)'
    Page:
      type: integer
      minimum: 1
      default: 1
      example: 1
      description: 'Page number (default: 1)'
    BenefitFamilyParam:
      type: array
      items:
        enum:
        - mec
        - mvp
        - ichra
        - vpc
        - dental
        - vision
        type: string
        description: |-
          * `mec` - mec
          * `mvp` - mvp
          * `ichra` - ichra
          * `vpc` - vpc
          * `dental` - dental
          * `vision` - vision
      default: []
      description: Filter to employers with at least one active benefit in these families.
    BenefitLifecycleStage:
      type: array
      items:
        enum:
        - open_enrollment
        - renewal
        - active
        - onboarding
        - cancelled
        type: string
        description: |-
          * `open_enrollment` - open_enrollment
          * `renewal` - renewal
          * `active` - active
          * `onboarding` - onboarding
          * `cancelled` - cancelled
      default: []
      description: Filter to employers in one of these computed benefit-lifecycle stages.
    HrisProvider:
      type: array
      items:
        type: string
      default: []
      description: Filter to employers whose HRIS connection is with one of these payroll providers (e.g. `ADP RUN`). Matched case-insensitively; free text, so read the available values from the HRIS-providers endpoint rather than assuming a fixed set.
    HrisStatus:
      type: array
      items:
        enum:
        - Pending
        - Active
        - Inactive
        - Paused
        - Terminated
        type: string
        description: |-
          * `Pending` - Pending
          * `Active` - Active
          * `Inactive` - Inactive
          * `Paused` - Paused
          * `Terminated` - Terminated
      default: []
      description: Filter to employers whose HRIS connection is in one of these statuses.
    IncludeCancelled:
      type: boolean
      default: false
      description: Include cancelled employers (hidden by default unless their stage is explicitly requested).
    Search:
      type: string
      nullable: true
      minLength: 1
      description: 'Employer filter. Matches the display name or the legal name case-insensitively as a substring, or one of these exactly: the EIN (with or without its dash), the employer id, or the contact email of one of the employer''s non-disabled admins.'
    EmployerId:
      type: string
      example: empr_abc123def456
      description: Unique employer identifier (empr_*)
    AcaClassificationParam:
      type: string
      enum:
      - FULL_TIME
      description: Filters to an exact ACA classification.
    Name:
      type: string
      description: Filters to employees whose first or last name contains this text (case-insensitive).
    BenefitPlanYearId:
      type: string
      example: plyr_abc123def456
      description: Unique benefit-plan-year identifier (plyr_*).
    ElectionStatus:
      type: array
      items:
        type: string
        enum:
        - Enrolled
        - Expired
        - Pending
        - Waived
      description: Filter by election status. Repeat the parameter to match several.
    EmployerSearch:
      type: string
      description: Case-insensitive search. Matches member name partially, and the `member_id` exactly — either your own reference id or the prefixed `grpmbr_<...>` id.
    EmployeeSearch:
      type: string
      example: jane
      description: Case-insensitive search across employee first name, last name, and email
    Offset:
      type: string
      nullable: true
      minLength: 1
      description: Opaque cursor from a previous page's next_offset
    InvoiceId:
      type: string
      example: INV-00042
      description: External Chargebee invoice id (not a prefixed UUID).
    EnrollmentId:
      type: string
      example: enrl_AAAAAAAAAAAAAAAAAAAAAQ
      description: Unique enrollment identifier (enrl_*)
    GroupId:
      type: string
      example: grp_abc123def456
      description: Unique group identifier (grp_*)
    RequestId:
      type: string
    MemberId:
      type: string
      example: mbr_abc123def456
      description: Unique member identifier (mbr_*)
    Status:
      type: string
      enum:
      - approved
      - denied
      - pending
      description: Optional. Filter to a single QLE status; omit to return all statuses.
    CreatedAfter:
      type: string
      format: date-time
    CreatedBefore:
      type: string
      format: date-time
    EventName:
      enum:
      - enrollment.accepted
      - enrollment.terminated
      - enrollment.termination_rescheduled
      - enrollment.elected
      - enrollment.granted
      - enrollment.waived
      - enrollment.started
      - employee.eligibility_granted
      - employee.eligibility_terminated
      - employee.deactivated
      - employee.deduction_created
      type: string
      minLength: 1
      description: |-
        * `enrollment.accepted` - Enrollment Accepted
        * `enrollment.terminated` - Enrollment Terminated
        * `enrollment.termination_rescheduled` - Enrollment Termination Rescheduled
        * `enrollment.elected` - Enrollment Elected
        * `enrollment.granted` - Enrollment Granted
        * `enrollment.waived` - Enrollment Waived
        * `enrollment.started` - Enrollment Started
        * `employee.eligibility_granted` - Employee Eligibility Granted
        * `employee.eligibility_terminated` - Employee Eligibility Terminated
        * `employee.deactivated` - Employee Deactivated
        * `employee.deduction_created` - Employee Deduction Created
    ResourceId:
      type: string
      minLength: 1
    ResourceType:
      enum:
      - enrollment
      - employee
      - employer
      - dependent
      - plan_year
      - payroll_deduction
      type: string
      minLength: 1
      description: |-
        * `enrollment` - Enrollment
        * `employee` - Employee
        * `employer` - Employer
        * `dependent` - Dependent
        * `plan_year` - Plan Year
        * `payroll_deduction` - Payroll Deduction
    EventId:
      type: string
    MemberSearch:
      type: string
      description: Case-insensitive search across member name and email; exact match on member id
    PersonaSummaryList:
      type: array
      items:
        $ref: '#/components/schemas/PersonaSummary'
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
      description: API Key or Access Token authentication using Bearer token in Authorization header. API keys use the vit_apk_ prefix, access tokens use the vit_at_ prefix.
    IdentityProviderBearer:
      type: http
      scheme: bearer
      description: IdP-issued bearer token (WorkOS or vitable). Forwarded to the identity endpoints; the auth class routes it by issuer, introspects it via IIdentityProvider, and hydrates request.user with the matching BaseUser — or AnonymousUser for a valid but not-yet-provisioned identity (the strict variant rejects that case).
servers:
- url: https://api.vitablehealth.com
  description: Production server
- url: https://api.uat.vitablehealth.com
  description: UAT server
tags:
- name: Access Tokens
  description: Issue short-lived access tokens for scoped API access
- name: Employers
  description: Manage employer organizations that offer benefits to their employees
- name: Benefit Products
  description: Browse available benefit products that can be offered to employers
- name: Plan Years
  description: Configure annual benefit periods with coverage dates and contribution settings
- name: Employees
  description: Manage employee records for employers
- name: Dependents
  description: Manage dependent records (spouses, children) for employees
- name: Qualifying Life Events
  description: Record life events that trigger special enrollment periods
- name: Enrollments
  description: Manage benefit enrollments and elections for employees
- name: Members
  description: Browse the members covered across your book and read a member's profile
security:
- APIKeyAuth: []
