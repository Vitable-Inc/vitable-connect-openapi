          items:
            $ref: '#/components/schemas/PlanYear'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - data
      - pagination
    PlanYearResponse:
      type: object
      description: Response containing a single plan year resource.
      properties:
        data:
          $ref: '#/components/schemas/PlanYear'
      required:
      - data
    PlanYearStatus:
      enum:
      - draft
      - open_enrollment
      - active
      - expired
      type: string
      description: |-
        * `draft` - Draft
        * `open_enrollment` - Open Enrollment
        * `active` - Active
        * `expired` - Expired
    ProductCode:
      enum:
      - EBA
      - VPC
      - VPC_CORE
      - MEC
      - MEC2
      - MEC_PLUS
      - MVP
      - MVP2
      - MVPSL
      - MVPSL2
      - VD
      - VV
      - ICHRA
      - ICHRA_PREMIUM_PLUS
      - ICHRA_REIMBURSEMENT_ONLY
      type: string
      description: |-
        * `EBA` - Eba Mec
        * `VPC` - Vpc Enhanced
        * `VPC_CORE` - Vpc Core
        * `MEC` - Vpc Mec
        * `MEC2` - Mec2
        * `MEC_PLUS` - Mec Plus
        * `MVP` - Mvp
        * `MVP2` - Mvp2
        * `MVPSL` - Mvpsl
        * `MVPSL2` - Mvpsl2
        * `VD` - Dental
        * `VV` - Vision
        * `ICHRA` - Ichra
        * `ICHRA_PREMIUM_PLUS` - Ichra Premium Plus
        * `ICHRA_REIMBURSEMENT_ONLY` - Ichra Reimbursement Only
    QualifyingLifeEvent:
      type: object
      description: |-
        Serializer for Qualifying Life Event entity in public API responses.

        QLEs are significant life changes (marriage, birth, adoption, loss of coverage)
        that allow employees to modify benefit elections outside of open enrollment.
      properties:
        id:
          type: string
          description: Unique QLE identifier with 'qle_' prefix
        member_id:
          type: string
          description: ID of the member experiencing the life event (mbr_*)
        employee_id:
          type: string
          description: ID of the employee (empl_*)
        event_type:
          type: string
          description: Type of qualifying life event (e.g., 'marriage', 'birth', 'adoption', 'loss_of_coverage', 'divorce')
        event_date:
          type: string
          format: date
          description: Date when the qualifying life event occurred
        status:
          allOf:
          - $ref: '#/components/schemas/QualifyingLifeEventStatus'
          description: |-
            Current review status of the QLE

            * `pending` - Pending
            * `approved` - Approved
            * `denied` - Denied
        enrollment_window_start:
          type: string
          format: date-time
          description: Start of the special enrollment period
        enrollment_window_end:
          type: string
          format: date-time
          description: End of the special enrollment period (typically 30-60 days from event)
        reviewed_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the QLE was reviewed, if reviewed
        reviewed_by:
          type: string
          nullable: true
          description: ID of the user who reviewed the QLE, if reviewed
        notes:
          type: string
          nullable: true
          description: Additional notes or comments about the QLE
        created_at:
          type: string
          format: date-time
          description: Timestamp when the QLE was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the QLE was last updated
      required:
      - created_at
      - employee_id
      - enrollment_window_end
      - enrollment_window_start
      - event_date
      - event_type
      - id
      - member_id
      - status
      - updated_at
    QualifyingLifeEventListResponse:
      type: object
      description: Paginated list response containing qualifying life event resources.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QualifyingLifeEvent'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - data
      - pagination
    QualifyingLifeEventResponse:
      type: object
      description: Response containing a single qualifying life event resource.
      properties:
        data:
          $ref: '#/components/schemas/QualifyingLifeEvent'
      required:
      - data
    QualifyingLifeEventStatus:
      enum:
      - pending
      - approved
      - denied
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `denied` - Denied
    ReissueEnrollmentRequest:
      type: object
      properties:
        qle_id:
          type: string
          description: ID of the qualifying life event (qle_*)
        reason:
          type: string
          nullable: true
          description: Optional reason for reissue
          maxLength: 500
      required:
      - qle_id
    Relationship:
      enum:
      - Spouse
      - Child
      type: string
      description: |-
        * `Spouse` - Spouse
        * `Child` - Child
    Sex:
      enum:
      - Male
      - Female
      - Other
      - Unknown
      type: string
      description: |-
        * `Male` - Male
        * `Female` - Female
        * `Other` - Other
        * `Unknown` - Unknown
    Type:
      enum:
      - employer
      - employee
      type: string
      description: |-
        * `employer` - employer
        * `employee` - employee
    UpdateDependentRequest:
      type: object
      properties:
        gender:
          type: string
          nullable: true
          description: Gender identity
        relationship:
          allOf:
          - $ref: '#/components/schemas/Relationship'
          nullable: true
          description: |-
            Relationship to the primary member (Spouse, Child)

            * `Spouse` - Spouse
            * `Child` - Child
        active:
          type: boolean
          nullable: true
          description: Whether the dependent is active
    UpdateEmployeeAddressInput:
      type: object
      properties:
        street_1:
          type: string
          description: Primary street address
        street_2:
          type: string
          nullable: true
          description: Secondary street address
        city:
          type: string
          description: City name
        state:
          type: string
          description: Two-letter state code
          maxLength: 2
          minLength: 2
        zip_code:
          type: string
          description: ZIP code
        country:
          type: string
          default: US
          description: Country code
      required:
      - city
      - state
      - street_1
      - zip_code
    UpdateEmployeeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
          description: Email address
        phone:
          type: string
          nullable: true
          description: Phone number
        gender:
          type: string
          nullable: true
          description: Gender identity
        employee_class:
          allOf:
          - $ref: '#/components/schemas/EmployeeClass'
          nullable: true
          description: |-
            Employment classification

            * `Full Time` - Full Time
            * `Part Time` - Part Time
            * `Temporary` - Temporary
            * `Intern` - Intern
            * `Seasonal` - Seasonal
            * `Individual Contractor` - Individual Contractor
        termination_date:
          type: string
          format: date
          nullable: true
          description: Termination date if terminating
        address:
          allOf:
          - $ref: '#/components/schemas/UpdateEmployeeAddressInput'
          nullable: true
          description: Employee's residential address
    UpdateEmployerAddressInput:
      type: object
      properties:
        address_line_1:
          type: string
          description: Primary street address
        address_line_2:
          type: string
          nullable: true
          description: Secondary street address
        city:
          type: string
          description: City name
        state:
          type: string
          description: Two-letter state code
          maxLength: 2
          minLength: 2
        zipcode:
          type: string
          description: ZIP code
      required:
      - address_line_1
      - city
      - state
      - zipcode
    UpdateEmployerRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: Employer display name
          maxLength: 255
          minLength: 1
        legal_name:
          type: string
          nullable: true
          description: Legal business name
          maxLength: 255
          minLength: 1
        address:
          allOf:
          - $ref: '#/components/schemas/UpdateEmployerAddressInput'
          nullable: true
          description: Employer address
        active:
          type: boolean
          nullable: true
          description: Whether the employer is active
    UpdatePlanYearContributionClassInput:
      type: object
      description: Contribution class input for plan year update.
      properties:
        employment:
          type: string
          description: Employment type
        coverage_tier:
          allOf:
          - $ref: '#/components/schemas/CoverageTier'
          description: |-
            Family coverage tier: EE (Employee Only), ES (Employee+Spouse), EC (Employee+Children), EF (Employee+Family)

            * `Unspecified` - Unspecified
            * `EE` - Ee
            * `ES` - Es
            * `EC` - Ec
            * `EF` - Ef
        employee_contribution_cents:
          type: integer
          minimum: 0
          description: Employee's monthly contribution in cents
        employer_contribution_cents:
          type: integer
          minimum: 0
          description: Employer's monthly contribution in cents
      required:
      - coverage_tier
      - employee_contribution_cents
      - employer_contribution_cents
      - employment
    UpdatePlanYearRequest:
      type: object
      description: |-
        Request for updating a plan year.

        All fields are optional - only provided fields will be updated.
        Important: Plan years can only be edited until open enrollment starts.
      properties:
        open_enrollment_start:
          type: string
          format: date
          nullable: true
          description: Open enrollment start date
        open_enrollment_end:
          type: string
          format: date
          nullable: true
          description: Open enrollment end date
        contribution_classes:
          type: array
          items:
            $ref: '#/components/schemas/UpdatePlanYearContributionClassInput'
          nullable: true
          description: Updated contribution classes
        status:
          type: string
          nullable: true
          description: Plan year status
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the error occurred
        message:
          type: string
          description: Human-readable error message
        error:
          type: string
          description: Error message (same as message, for backwards compatibility)
        app_error_code:
          type: string
          nullable: true
          description: Application-specific error code for programmatic handling
        trace_id:
          type: string
          format: uuid
          description: Unique trace ID for debugging and support requests
      required:
      - timestamp
      - message
      - error
      - trace_id
    PolicyId:
      type: string
      example: epol_abc123def456
      description: Unique benefit eligibility policy identifier (epol_*)
    ActiveIn:
      type: boolean
      example: true
      description: Filter by active status
    Limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
      example: 20
      description: 'Items per page (default: 20, max: 100)'
    Page:
      type: integer
      minimum: 1
      default: 1
      example: 1
      description: 'Page number (default: 1)'
    BenefitProductId:
      type: string
      example: bprd_abc123def456
      description: Unique benefit product identifier (bprd_*)
    EmployerId:
      type: string
      example: empr_abc123def456
      description: Filter by employer ID
    DependentId:
      type: string
      example: dpnd_abc123def456
      description: Unique dependent identifier (dpnd_*)
    EmployeeId:
      type: string
      example: empl_abc123def456
      description: Unique employee identifier (empl_*)
    CoverageEffectiveStartYear:
      type: integer
      example: 2025
      description: Filter by coverage year
    PlanYearParam:
      type: integer
      example: 2025
      description: Filter by plan year start (YYYY)
    Name:
      type: string
      example: Acme
      description: Filter by employer name (partial match)
    PolicyToReplaceId:
      type: string
      example: epol_abc123def456
      description: ID of existing policy to replace (epol_*)
    EnrollmentId:
      type: string
      example: enrl_abc123def456
      description: Unique enrollment identifier (enrl_*)
    MemberId:
      type: string
      example: mbr_abc123def456
      description: Unique member identifier (mbr_*)
    QleId:
      type: string
      example: qle_abc123def456
      description: Unique qualifying life event identifier (qle_*)
    PlanYearId:
      type: string
      example: plyr_abc123def456
      description: Unique plan year identifier (plyr_*)
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
      description: API Key or Access Token authentication using Bearer token in Authorization header. API keys use the vit_apk_ prefix, access tokens use the vit_at_ prefix.
servers:
- url: https://api.vitablehealth.com
  description: Production server
- url: https://api.uat.vitablehealth.com
  description: UAT server
tags:
- name: Access Tokens
  description: Issue short-lived access tokens for scoped API access
- name: Employers
  description: Manage employer organizations that offer benefits to their employees
- name: Benefit Eligibility Policies
  description: Define rules that determine which employees qualify for benefits
- name: Benefit Products
  description: Browse available benefit products that can be offered to employers
- name: Plan Years
  description: Configure annual benefit periods with coverage dates and contribution settings
- name: Employees
  description: Manage employee records for employers
- name: Dependents
  description: Manage dependent records (spouses, children) for employees
- name: Qualifying Life Events
  description: Record life events that trigger special enrollment periods
- name: Enrollments
  description: Manage benefit enrollments and elections for employees
security:
- APIKeyAuth: []
