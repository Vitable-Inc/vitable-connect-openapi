components:
  schemas:
    AccessTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: The issued access token (vit_at_*)
        token_type:
          type: string
          description: Token type, always 'Bearer'
        expires_in:
          type: integer
          description: Token lifetime in seconds
        bound_entity:
          allOf:
          - $ref: '#/components/schemas/BoundEntityResponse'
          nullable: true
          description: Entity the token is bound to, if any
      required:
      - access_token
      - expires_in
      - token_type
    BenefitEligibilityPolicy:
      type: object
      description: |-
        Serializer for Benefit Eligibility Policy entity.

        Eligibility policies define rules that determine which employees qualify for benefits.
      properties:
        id:
          type: string
          description: Unique eligibility policy identifier with 'epol_' prefix
        employer_id:
          type: string
          description: ID of the employer this policy belongs to (empr_*)
        name:
          type: string
          description: Display name for the eligibility policy
        description:
          type: string
          nullable: true
          description: Detailed description of the policy
        rules:
          type: array
          items:
            $ref: '#/components/schemas/EligibilityRule'
          description: List of eligibility rules that must be satisfied
        effective_date:
          type: string
          format: date
          description: Date when this policy becomes effective
        replaced_policy_id:
          type: string
          nullable: true
          description: ID of the policy this one replaces, if any (epol_*)
        active_in:
          type: boolean
          description: Whether this policy is currently active
        created_at:
          type: string
          format: date-time
          description: Timestamp when the policy was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the policy was last updated
      required:
      - active_in
      - created_at
      - effective_date
      - employer_id
      - id
      - name
      - rules
      - updated_at
    BenefitEligibilityPolicyResponse:
      type: object
      description: Response containing a single benefit eligibility policy resource.
      properties:
        data:
          $ref: '#/components/schemas/BenefitEligibilityPolicy'
      required:
      - data
    BenefitProduct:
      type: object
      description: |-
        Serializer for Benefit Product entity in public API responses.

        Benefit Products represent types of benefits (dental, vision, medical, etc.)
        that an Organization can offer to their Employers.
      properties:
        id:
          type: string
          description: Unique benefit product identifier with 'bprd_' prefix
        name:
          type: string
          description: Display name of the benefit product
        product_code:
          allOf:
          - $ref: '#/components/schemas/ProductCode'
          description: |-
            Benefit product code

            * `EBA` - Eba Mec
            * `VPC` - Vpc Enhanced
            * `VPC_CORE` - Vpc Core
            * `MEC` - Vpc Mec
            * `MEC2` - Mec2
            * `MEC_PLUS` - Mec Plus
            * `MVP` - Mvp
            * `MVP2` - Mvp2
            * `MVPSL` - Mvpsl
            * `MVPSL2` - Mvpsl2
            * `VD` - Dental
            * `VV` - Vision
            * `ICHRA` - Ichra
            * `ICHRA_PREMIUM_PLUS` - Ichra Premium Plus
            * `ICHRA_REIMBURSEMENT_ONLY` - Ichra Reimbursement Only
        description:
          type: string
          nullable: true
          description: Detailed description of the benefit product
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          description: |-
            Category of the benefit

            * `Medical` - Medical
            * `Dental` - Dental
            * `Vision` - Vision
            * `Hospital` - Hospital
        carrier_name:
          type: string
          nullable: true
          description: Name of the carrier providing this product
        active_in:
          type: boolean
          description: Whether this product is currently available for offering
        created_at:
          type: string
          format: date-time
          description: Timestamp when the product was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the product was last updated
      required:
      - active_in
      - category
      - created_at
      - id
      - name
      - product_code
      - updated_at
    BenefitProductListResponse:
      type: object
      description: Paginated list response containing benefit product resources.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BenefitProduct'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - data
      - pagination
    BoundEntity:
      type: object
      properties:
        id:
          type: string
          description: Prefixed entity ID to bind the token to (empr_* for employer, empl_* for employee)
        type:
          allOf:
          - $ref: '#/components/schemas/Type'
          description: |-
            Type of entity: 'employer' or 'employee'

            * `employer` - employer
            * `employee` - employee
      required:
      - id
      - type
    BoundEntityResponse:
      type: object
      properties:
        id:
          type: string
          description: Prefixed entity ID the token is bound to (empr_* or empl_*)
        type:
          allOf:
          - $ref: '#/components/schemas/Type'
          description: |-
            Type of bound entity

            * `employer` - employer
            * `employee` - employee
      required:
      - id
      - type
    Category:
      enum:
      - Medical
      - Dental
      - Vision
      - Hospital
      type: string
      description: |-
        * `Medical` - Medical
        * `Dental` - Dental
        * `Vision` - Vision
        * `Hospital` - Hospital
    CoverageTier:
      enum:
      - Unspecified
      - EE
      - ES
      - EC
      - EF
      type: string
      description: |-
        * `Unspecified` - Unspecified
        * `EE` - Ee
        * `ES` - Es
        * `EC` - Ec
        * `EF` - Ef
    CreateBenefitEligibilityPolicyRequest:
      type: object
      properties:
        name:
          type: string
          description: Display name for the policy
          maxLength: 255
          minLength: 1
        description:
          type: string
          nullable: true
          description: Detailed description
        rules:
          type: array
          items:
            $ref: '#/components/schemas/EligibilityRuleInput'
          description: List of eligibility rules (at least one required)
          minItems: 1
        effective_date:
          type: string
          format: date
          description: Date when policy becomes effective
      required:
      - effective_date
      - name
      - rules
    CreateDependentRequest:
      type: object
      properties:
        first_name:
          type: string
          description: Dependent's legal first name
          maxLength: 100
          minLength: 1
        last_name:
          type: string
          description: Dependent's legal last name
          maxLength: 100
          minLength: 1
        suffix:
          type: string
          nullable: true
          description: Name suffix (Jr., Sr., III)
          maxLength: 10
        date_of_birth:
          type: string
          format: date
          description: Date of birth (YYYY-MM-DD)
        sex:
          allOf:
          - $ref: '#/components/schemas/Sex'
          description: |-
            Biological sex (Male, Female, Other, Unknown)

            * `Male` - Male
            * `Female` - Female
            * `Other` - Other
            * `Unknown` - Unknown
        gender:
          type: string
          nullable: true
          description: Gender identity
        relationship:
          allOf:
          - $ref: '#/components/schemas/Relationship'
          description: |-
            Relationship to the primary member (Spouse, Child)

            * `Spouse` - Spouse
            * `Child` - Child
        ssn:
          type: string
          nullable: true
          description: Social Security Number (optional, XXX-XX-XXXX or XXXXXXXXX)
          maxLength: 11
          minLength: 9
      required:
      - date_of_birth
      - first_name
      - last_name
      - relationship
      - sex
    CreateEmployeeRequest:
      type: object
      properties:
        first_name:
          type: string
          description: Employee's legal first name
          maxLength: 100
          minLength: 1
        last_name:
          type: string
          description: Employee's legal last name
          maxLength: 100
          minLength: 1
        suffix:
          type: string
          nullable: true
          description: Name suffix (Jr., Sr., III)
          maxLength: 10
        date_of_birth:
          type: string
          format: date
          description: Date of birth (YYYY-MM-DD)
        sex:
          allOf:
          - $ref: '#/components/schemas/Sex'
          description: |-
            Biological sex (Male, Female, Other, Unknown)

            * `Male` - Male
            * `Female` - Female
            * `Other` - Other
            * `Unknown` - Unknown
        gender:
          type: string
          nullable: true
          description: Gender identity
        email:
          type: string
          format: email
          description: Email address
        phone:
          type: string
          nullable: true
          description: Phone number
        ssn:
          type: string
          description: Social Security Number (XXX-XX-XXXX or XXXXXXXXX). Only accepted on create.
          maxLength: 11
          minLength: 9
        start_date:
          type: string
          format: date
          description: Employment start/hire date
        employee_class:
          allOf:
          - $ref: '#/components/schemas/EmployeeClass'
          nullable: true
          description: |-
            Employment classification

            * `Full Time` - Full Time
            * `Part Time` - Part Time
            * `Temporary` - Temporary
            * `Intern` - Intern
            * `Seasonal` - Seasonal
            * `Individual Contractor` - Individual Contractor
        address:
          allOf:
          - $ref: '#/components/schemas/EmployeeAddressInput'
          nullable: true
          description: Employee's residential address
      required:
      - date_of_birth
      - email
      - first_name
      - last_name
      - sex
      - ssn
      - start_date
    CreateEmployerRequest:
      type: object
      properties:
        name:
          type: string
          description: Employer display name
          maxLength: 255
          minLength: 1
        legal_name:
          type: string
          description: Legal business name
          maxLength: 255
          minLength: 1
        ein:
          type: string
          description: 'Employer Identification Number (format: XX-XXXXXXX)'
          maxLength: 10
          minLength: 10
        email:
          type: string
          format: email
          description: Email address for billing and communications
        address:
          allOf:
          - $ref: '#/components/schemas/EmployerAddressInput'
          description: Employer address
      required:
      - address
      - ein
      - email
      - legal_name
      - name
    CreatePlanYearRequest:
      type: object
      description: |-
        Request for creating a new plan year.

        Configures coverage period, open enrollment window, and contribution structure.
        All monetary values must be in cents.
      properties:
        employer_id:
          type: string
          description: Employer ID this plan year is for (empr_*)
        coverage_start:
          type: string
          format: date
          description: Coverage start date
        coverage_end:
          type: string
          format: date
          description: Coverage end date
        open_enrollment_start:
          type: string
          format: date
          description: Open enrollment start date
        open_enrollment_end:
          type: string
          format: date
          description: Open enrollment end date
        contribution_classes:
          type: array
          items:
            $ref: '#/components/schemas/PlanYearContributionClassInput'
          description: List of contribution classes (at least one required)
          minItems: 1
      required:
      - contribution_classes
      - coverage_end
      - coverage_start
      - employer_id
      - open_enrollment_end
      - open_enrollment_start
    CreateQualifyingLifeEventRequest:
      type: object
      properties:
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventType'
          description: |-
            Type of qualifying life event

            * `Marriage` - Marriage
            * `Birth` - Birth
            * `Adoption` - Adoption
            * `Divorce` - Divorce
            * `Death` - Death
            * `Job Loss` - Job Loss
            * `Reduction In Hours` - Reduction In Hours
            * `Employer Bankruptcy` - Employer Bankruptcy
            * `Medicare Entitlement` - Medicare Entitlement
            * `Termination` - Termination
            * `Other` - Other
        event_date:
          type: string
          format: date
          description: Date when the event occurred
        notes:
          type: string
          nullable: true
          description: Optional notes about the event
          maxLength: 1000
      required:
      - event_date
      - event_type
    Decision:
      enum:
      - Enrolled
      - Waived
      type: string
      description: |-
        * `Enrolled` - Enrolled
        * `Waived` - Waived
    Dependent:
      type: object
      description: |-
        Serializer for Dependent entity in public API responses.

        Dependents are family members (spouse, children) who may be eligible
        for benefit coverage through an employee.
      properties:
        id:
          type: string
          description: Unique dependent identifier with 'dpnd_' prefix
        member_id:
          type: string
          description: ID of the primary member/employee (mbr_*)
        first_name:
          type: string
          description: Dependent's legal first name
        last_name:
          type: string
          description: Dependent's legal last name
        suffix:
          type: string
          nullable: true
          description: Name suffix (e.g., Jr., Sr., III)
        date_of_birth:
          type: string
          format: date
          description: Dependent's date of birth (YYYY-MM-DD)
        sex:
          allOf:
          - $ref: '#/components/schemas/Sex'
          description: |-
            Biological sex (Male, Female, Other, Unknown)

            * `Male` - Male
