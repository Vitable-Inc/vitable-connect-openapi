    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          description: Prefixed unique identifier for this delivery (e.g., `wdlv_...`).
        webhook_event_id:
          type: string
          description: The webhook event this delivery belongs to.
        subscription_id:
          type: string
          description: The webhook subscription this delivery was sent to.
        status:
          type: string
          description: 'Current delivery status: Pending, In Progress, Delivered, or Failed.'
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When the delivery attempt started, in UTC.
        delivered_at:
          type: string
          format: date-time
          nullable: true
          description: When the delivery was successfully received, in UTC.
        failed_at:
          type: string
          format: date-time
          nullable: true
          description: When the delivery was marked as permanently failed, in UTC.
        failure_reason:
          type: string
          description: Reason for failure, if applicable.
        created_at:
          type: string
          format: date-time
          description: When this delivery record was created, in UTC.
      required:
      - created_at
      - delivered_at
      - failed_at
      - failure_reason
      - id
      - started_at
      - status
      - subscription_id
      - webhook_event_id
    WebhookEvent:
      type: object
      properties:
        id:
          type: string
          description: Prefixed unique identifier for this webhook event (e.g., `wevt_...`).
        organization_id:
          type: string
          description: The organization this event belongs to.
        event_name:
          type: string
          description: The event type, formatted as `{resource}.{action}` (e.g., `enrollment.accepted`).
        resource_type:
          type: string
          description: The type of resource affected (e.g., `enrollment`, `employee`).
        resource_id:
          type: string
          description: Prefixed ID of the affected resource. Use this to fetch the current state from the API.
        created_at:
          type: string
          format: date-time
          description: When the event occurred, in UTC.
      required:
      - created_at
      - event_name
      - id
      - organization_id
      - resource_id
      - resource_type
    WebhookEventListResponse:
      type: object
      description: Paginated list response containing webhook event resources.
      properties:
