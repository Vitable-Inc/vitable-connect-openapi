              description: Maximum number of requests allowed within the rate limit window
              schema:
                type: integer
                example: 1000
            X-RateLimit-Remaining:
              description: Number of requests remaining in the current rate limit window
              schema:
                type: integer
                example: 999
            X-RateLimit-Reset:
              description: Unix timestamp (seconds) when the rate limit window resets
              schema:
                type: integer
                example: 1700000000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ACAFullTimeEmployee:
      type: object
      description: |-
        One employee's ACA full-time determination, list view.

        Enrollment status is intentionally not included — see the DTO's docstring for why.
      properties:
        employee_id:
          type: string
          description: Prefixed employee identifier (`empl_*`).
        first_name:
          type: string
        last_name:
          type: string
        designated_classification:
          allOf:
          - $ref: '#/components/schemas/EmployeeClass'
          description: |-
            Payroll classification.

            * `Full Time` - Full Time
            * `Part Time` - Part Time
            * `Temporary` - Temporary
            * `Intern` - Intern
            * `Seasonal` - Seasonal
            * `Individual Contractor` - Individual Contractor
        aca_classification:
          allOf:
          - $ref: '#/components/schemas/AcaClassification'
          description: |-
            ACA measurement outcome. Currently always FULL_TIME.

            * `FULL_TIME` - Full Time
        required_coverage_start_date:
          type: string
          format: date
          description: Equals the stability period start date.
        measurement_period_start_date:
          type: string
          format: date
        measurement_period_end_date:
          type: string
          format: date
        measurement_period_type:
          allOf:
          - $ref: '#/components/schemas/MeasurementPeriodType'
          description: |-
            `initial` for a new hire's initial measurement period, `standard` for the employer-wide one.

            * `initial` - Initial
            * `standard` - Standard
        measurement_period_average_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          description: Vendor-reported average hours over the measurement period.
        stability_period_start_date:
          type: string
          format: date
        stability_period_end_date:
          type: string
          format: date
      required:
      - aca_classification
      - designated_classification
      - employee_id
      - first_name
      - last_name
      - measurement_period_average_hours
      - measurement_period_end_date
      - measurement_period_start_date
      - measurement_period_type
      - required_coverage_start_date
      - stability_period_end_date
      - stability_period_start_date
    AcaClassification:
      enum:
      - FULL_TIME
      type: string
      description: '* `FULL_TIME` - Full Time'
    AccessMethod:
      enum:
      - SELF_SETUP
      - NEEDS_HELP
      type: string
      description: |-
        * `SELF_SETUP` - SELF_SETUP
        * `NEEDS_HELP` - NEEDS_HELP
    AccessTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: The issued access token (vit_at_*)
        token_type:
          type: string
          description: Token type, always 'Bearer'
        expires_in:
          type: integer
          description: Token lifetime in seconds
        bound_entity:
          allOf:
          - $ref: '#/components/schemas/BoundEntityResponse'
          nullable: true
          description: Entity the token is bound to, if any
      required:
      - access_token
      - expires_in
      - token_type
    AdditionalAccessMethod:
      enum:
      - SELF_SETUP
      - NEEDS_HELP
      type: string
      description: |-
        * `SELF_SETUP` - SELF_SETUP
        * `NEEDS_HELP` - NEEDS_HELP
    Address:
      type: object
      description: |-
        Shared read serializer for a postal address on public API responses.

        One definition for the address block every public resource emits (employer, employee, …), so the
        5-field shape isn't hand-rolled per endpoint. Read-only: it renders an already-built address
        value object (e.g. ``AddressDVO``) whose attributes map 1:1 to these fields.
      properties:
        address_line_1:
          type: string
          description: Primary street address.
        address_line_2:
          type: string
          nullable: true
          description: Secondary street address (apt, suite, etc.).
        city:
          type: string
          description: City name.
        state:
          type: string
          description: Two-letter state code (e.g. `CA`, `NY`).
        zipcode:
          type: string
          description: ZIP code (5 or 9 digit).
      required:
      - address_line_1
      - address_line_2
      - city
      - state
      - zipcode
    AddressRequest:
      type: object
      properties:
        address_line_1:
          type: string
          maxLength: 255
          minLength: 1
        address_line_2:
          type: string
          nullable: true
          maxLength: 255
        city:
          type: string
          maxLength: 255
          minLength: 1
        state:
          type: string
          maxLength: 2
          minLength: 2
        zipcode:
          type: string
          maxLength: 20
          minLength: 1
      required:
      - address_line_1
      - city
      - state
      - zipcode
    AuthSession:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
      required:
      - user
    AuthUser:
      type: object
