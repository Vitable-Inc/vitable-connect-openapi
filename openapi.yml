  /v1/auth/login:
    post:
      operationId: auth_login
      description: 'One body-driven sign-in endpoint. Supply `email_or_phone` + `password` for the standard flow, or `email_or_phone` (no password) for the passwordless OTP flow. When the account has MFA enabled — or on the first passwordless step — an OTP challenge is issued and the response is a 200 `{"pending_2fa": true, "destination_hint": "…"}`; resubmit the same credentials plus `two_factor_token` to complete sign-in and receive a session with a freshly minted access/refresh token pair. Domain failures surface as the normalized error envelope with an `app_error_code`: 401 `invalid_credentials`; 403 `user_type_not_allowed` or `auth_user_disabled`; 409 `no_organization`; 429 `otp_cooldown`.'
      summary: Sign in with Vitable credentials (password or passwordless OTP)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
          headers:
