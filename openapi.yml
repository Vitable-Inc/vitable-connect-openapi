  /v1/members/{member_id}/qualifying-life-events:
    get:
      operationId: list_member_qualifying_life_events
      description: Lists a member's qualifying life events, including events already used for another enrollment. Returns all statuses by default; pass the status query param to filter to one (e.g. approved). Events are ordered newest submission first with stable paging. Custom text is present only when submitted and is otherwise null. A member not visible to the caller returns a 404. API keys and unbound access tokens have organization-wide access. Employer-bound tokens require employment at the bound employer, and employee-bound tokens require the exact employee-member relationship. Organization or scope mismatches return a 404 before pagination is validated.
      summary: List member qualifying life events
      parameters:
      - in: query
        name: limit
        schema:
          $ref: '#/components/schemas/Limit'
        description: 'Items per page (default: 20, max: 100)'
      - in: path
        name: member_id
        schema:
          $ref: '#/components/schemas/MemberId'
        description: Unique member identifier (mbr_*)
        required: true
      - in: query
        name: page
        schema:
          $ref: '#/components/schemas/Page'
        description: 'Page number (default: 1)'
      - in: query
        name: status
        schema:
          $ref: '#/components/schemas/Status'
        description: Optional. Filter to a single QLE status; omit to return all statuses.
      tags:
      - Members
      security:
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberQualifyingLifeEventListResponse'
