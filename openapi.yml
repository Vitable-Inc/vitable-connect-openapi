    Type:
      enum:
      - employer
      - employee
      type: string
      description: |-
        * `employer` - employer
        * `employee` - employee
    UpdateEmployerSettingsRequest:
      type: object
      properties:
        pay_frequency:
          $ref: '#/components/schemas/UpdateEmployerSettingsRequestPayFrequency'
      required:
      - pay_frequency
    UpdateEmployerSettingsRequestPayFrequency:
      enum:
      - weekly
      - bi_weekly
      - semi_monthly
      - monthly
      type: string
      description: |-
        * `weekly` - weekly
        * `bi_weekly` - bi_weekly
        * `semi_monthly` - semi_monthly
        * `monthly` - monthly
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          description: Prefixed unique identifier for this delivery (e.g., `wdlv_...`).
        webhook_event_id:
          type: string
          description: The webhook event this delivery belongs to.
        subscription_id:
          type: string
          description: The webhook subscription this delivery was sent to.
        status:
          type: string
          description: 'Current delivery status: Pending, In Progress, Delivered, or Failed.'
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When the delivery attempt started, in UTC.
        delivered_at:
          type: string
          format: date-time
          nullable: true
          description: When the delivery was successfully received, in UTC.
        failed_at:
          type: string
          format: date-time
          nullable: true
          description: When the delivery was marked as permanently failed, in UTC.
        failure_reason:
          type: string
          description: Reason for failure, if applicable.
        created_at:
          type: string
          format: date-time
          description: When this delivery record was created, in UTC.
      required:
      - created_at
      - delivered_at
      - failed_at
      - failure_reason
      - id
      - started_at
      - status
      - subscription_id
      - webhook_event_id
    WebhookEvent:
      type: object
      properties:
        id:
          type: string
          description: Prefixed unique identifier for this webhook event (e.g., `wevt_...`).
        organization_id:
          type: string
          description: The organization this event belongs to.
        event_name:
          type: string
          description: The event type, formatted as `{resource}.{action}` (e.g., `enrollment.accepted`).
        resource_type:
          type: string
          description: The type of resource affected (e.g., `enrollment`, `employee`).
        resource_id:
          type: string
          description: Prefixed ID of the affected resource. Use this to fetch the current state from the API.
        created_at:
          type: string
          format: date-time
          description: When the event occurred, in UTC.
      required:
      - created_at
      - event_name
      - id
      - organization_id
      - resource_id
      - resource_type
    WebhookEventListResponse:
      type: object
      description: Paginated list response containing webhook event resources.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - data
      - pagination
    WebhookEventResponse:
      type: object
      description: Response containing a single webhook event resource.
      properties:
        data:
          $ref: '#/components/schemas/WebhookEvent'
      required:
      - data
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the error occurred
        message:
          type: string
          description: Human-readable error message
        error:
          type: string
          description: Error message (same as message, for backwards compatibility)
        app_error_code:
          type: string
          nullable: true
          description: Application-specific error code for programmatic handling
        trace_id:
          type: string
          format: uuid
          description: Unique trace ID for debugging and support requests
      required:
      - timestamp
      - message
      - error
      - trace_id
    PolicyId:
      type: string
      example: epol_abc123def456
      description: Unique benefit eligibility policy identifier (epol_*)
    EmployeeId:
      type: string
      example: empl_abc123def456
      description: Unique employee identifier (empl_*)
    Limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
      example: 20
      description: 'Items per page (default: 20, max: 100)'
    Page:
      type: integer
      minimum: 1
      default: 1
      example: 1
      description: 'Page number (default: 1)'
    EmployerId:
      type: string
      example: empr_abc123def456
      description: Unique employer identifier (empr_*)
    EnrollmentId:
      type: string
      example: enrl_abc123def456
      description: Unique enrollment identifier (enrl_*)
