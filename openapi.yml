      type: object
      description: |-
        Body validator for POST /v1/auth/login — supports both credential flows.

        A single `email_or_phone` identifier (Vitable accounts sign in with either their email or their
        phone number). Standard: `email_or_phone` + `password` (+ optional `two_factor_token` for the MFA
        second step). Passwordless: `email_or_phone` (no password) + optional `two_factor_token` (the OTP
        code). The controller branches on the presence of `password`.

        `email_or_phone` is required: an OTP / 2FA token is not unique per user, so the identifier is
        always needed to resolve who is signing in. `app_name` / `app_version` identify the calling client
        for the login-attempt audit records.
