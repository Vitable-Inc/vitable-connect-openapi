  /v1/employers/{employer_id}/employees:
    get:
      operationId: list_employees
      description: Retrieves a paginated list of all employees for a specific employer. Use query parameters to filter by active status or employment classification. Results are paginated using page and limit parameters.
      summary: List employees
      parameters:
      - in: query
        name: active_in
        schema:
          $ref: '#/components/schemas/ActiveIn'
        description: Filter by active status
      - in: query
        name: employee_class
        schema:
          $ref: '#/components/schemas/EmployeeClass'
        description: Filter by employment classification
      - in: path
        name: employer_id
        schema:
          $ref: '#/components/schemas/EmployerId'
        description: Unique employer identifier (empr_*)
        required: true
      - in: query
        name: limit
        schema:
          $ref: '#/components/schemas/Limit'
        description: 'Items per page (default: 20, max: 100)'
      - in: query
        name: page
        schema:
          $ref: '#/components/schemas/Page'
        description: 'Page number (default: 1)'
      tags:
      - Employees
      security:
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
              examples:
                EmployeesList:
                  value:
                    data:
                    - id: empl_abc123
                      employer_id: empr_xyz789
                      member:
                        id: mbr_xyz789
                        first_name: John
                        last_name: Doe
                        suffix: null
                        date_of_birth: '1985-06-15'
                        sex: Male
                        gender: null
                        email: john.doe@example.com
                        phone: +1-555-123-4567
                      active_in: true
                      start_date: '2023-01-15'
                      termination_date: null
                      employee_class: Full Time
