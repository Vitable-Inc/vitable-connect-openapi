  /v1/employees/{employee_id}:
    get:
      operationId: get_employee
      description: Retrieves detailed information for a specific employee by ID. Returns employee details including personal information, employment status, and payroll deductions from the most recent statement period. Deductions reflect a snapshot of the current period and are replaced when a new statement is generated.
      summary: Get employee
      parameters:
      - in: path
        name: employee_id
        schema:
          $ref: '#/components/schemas/EmployeeId'
        description: Unique employee identifier (empl_*)
        required: true
      tags:
      - Employees
      security:
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
              examples:
                EmployeeDetail:
                  value:
                    data:
                      id: empl_abc123
                      member_id: mbr_xyz789
                      reference_id: partner-ee-001
                      first_name: John
                      last_name: Doe
                      suffix: null
                      email: john.doe@example.com
                      date_of_birth: '1985-06-15'
                      gender: null
                      phone: '4155551234'
                      employee_class: Full Time
                      status: active
                      hire_date: '2023-01-15'
                      termination_date: null
                      address:
                        address_line_1: 456 Oak Avenue
                        address_line_2: Apt 2B
                        city: San Francisco
                        state: CA
                        zipcode: '94102'
                      deductions:
                      - deduction_category: null
                        deduction_amount_in_cents: 5000
                        tax_classification: pre_tax
                        frequency: monthly
                        benefit_name: Gold PPO Plan
                        period_start_date: '2025-01-01'
                        period_end_date: '2025-01-31'
                      created_at: '2023-01-15T09:00:00Z'
                      updated_at: '2024-06-01T14:30:00Z'
                  summary: Employee Detail
          description: ''
          headers:
