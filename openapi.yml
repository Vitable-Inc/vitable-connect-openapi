  /v1/benefit-eligibility-policies/{policy_id}:
    get:
      operationId: get_benefit_eligibility_policy
      description: Retrieves detailed information for a specific benefit eligibility policy by ID. Returns the complete policy configuration including all eligibility rules, effective dates, associated employer information, and any waiting period requirements.
      summary: Get eligibility policy details
      parameters:
      - in: path
        name: policy_id
        schema:
          $ref: '#/components/schemas/PolicyId'
        description: Unique benefit eligibility policy identifier (epol_*)
        required: true
      tags:
      - Benefit Eligibility Policies
      security:
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitEligibilityPolicyResponse'
              examples:
                EligibilityPolicyDetail:
                  value:
                    data:
                      id: epol_abc123
                      employer_id: empr_abc123
                      name: Standard Full-Time Eligibility
                      description: Eligibility policy for full-time employees working 30+ hours per week
                      rules:
                      - rule_type: employment_status
                        operator: in
                        value:
                        - full_time
                        - part_time_30_plus
                      - rule_type: waiting_period_days
                        operator: greater_than_or_equal
                        value: 30
                      effective_date: '2024-01-01'
                      replaced_policy_id: null
                      active_in: true
                      created_at: '2023-12-01T10:00:00Z'
                      updated_at: '2023-12-01T10:00:00Z'
                  summary: Eligibility Policy Detail
