  /v1/benefit-products/{benefit_product_id}/plan-years:
    get:
      operationId: list_plan_years
      description: Retrieves a paginated list of plan years for a specific benefit product. Plan years define the coverage periods, open enrollment windows, and cost structure. Results are sorted by most recent plan year first.
      summary: List plan years for benefit
      parameters:
      - in: path
        name: benefit_product_id
        schema:
          $ref: '#/components/schemas/BenefitProductId'
        description: Unique benefit product identifier (bprd_*)
        required: true
      - in: query
        name: employer_id
        schema:
          $ref: '#/components/schemas/EmployerId'
        description: Filter by employer ID
      - in: query
        name: limit
        schema:
          $ref: '#/components/schemas/Limit'
        description: 'Items per page (default: 20, max: 100)'
      - in: query
        name: page
        schema:
          $ref: '#/components/schemas/Page'
        description: 'Page number (default: 1)'
      - in: query
        name: status
        schema:
          $ref: '#/components/schemas/PlanYearStatus'
        description: Filter by plan year status
      tags:
      - Plan Years
      security:
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanYearListResponse'
              examples:
                PlanYearsList:
                  value:
                    data:
                    - id: plyr_2025
                      benefit_product_id: bprd_dental001
