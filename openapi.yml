        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        idp_provider:
          $ref: '#/components/schemas/IdpProvider'
        idp_user_id:
          type: string
        phone:
          type: string
          nullable: true
      required:
      - base_user_id
      - email
      - first_name
      - idp_provider
      - idp_user_id
      - last_name
      - phone
      - user_type
    BenefitCoverage:
      type: object
      description: Wire serializer for :class:`BenefitCoverageDTO` (one member's active benefit coverage row).
      properties:
        enrollment_id:
          type: string
          example: enrl_AAAAAAAAAAAAAAAAAAAAAQ
          description: Opaque, stable enrollment identifier the coverage row was sourced from
        employer_name:
          type: string
          description: Name of the employer the coverage is through
        benefit_name:
          type: string
          description: Display name of the benefit product
        benefit_code:
          allOf:
          - $ref: '#/components/schemas/ProductCode'
          description: |-
            The benefit product code

            * `EBA` - Eba Mec
            * `VPC` - Vpc Enhanced
            * `VPC_CORE` - Vpc Core
            * `MEC` - Vpc Mec
            * `MEC2` - Mec2
            * `MEC_PLUS` - Mec Plus
            * `MVP` - Mvp
            * `MVP2` - Mvp2
            * `MVPSL` - Mvpsl
            * `MVPSL2` - Mvpsl2
            * `VD` - Dental
            * `VV` - Vision
            * `ICHRA` - Ichra
            * `ICHRA_PREMIUM_PLUS` - Ichra Premium Plus
            * `ICHRA_REIMBURSEMENT_ONLY` - Ichra Reimbursement Only
        benefit_type:
          allOf:
          - $ref: '#/components/schemas/Category'
          description: |-
            High-level benefit grouping (e.g., Medical, Dental)

            * `Medical` - Medical
            * `Dental` - Dental
            * `Vision` - Vision
            * `Hospital` - Hospital
        carrier_name:
          type: string
          description: Insurance carrier name
        claims_filing_url:
          type: string
          nullable: true
          description: Claims filing URL for this coverage; null when not on file
        benefit_summary_url:
          type: string
          nullable: true
          description: Benefit summary document URL; null when not on file
        summary_plan_description_url:
          type: string
          nullable: true
          description: Summary Plan Description (SPD) file URL; null when not on file
        plan_name:
          type: string
          description: Chosen benefit plan name
        tier_name:
          type: string
          description: Chosen benefit plan tier name (e.g., Employee Only)
        coverage_effective_date:
          type: string
          format: date-time
          nullable: true
          description: Coverage effective date/time; null when not yet effective
        coverage_end_date:
          type: string
          format: date-time
          nullable: true
          description: Coverage end date/time; null while coverage is open-ended
        plan_year_start_date:
          type: string
          format: date
          description: Benefit plan-year start date (YYYY-MM-DD)
        plan_year_end_date:
          type: string
          format: date
          nullable: true
          description: Benefit plan-year end date (YYYY-MM-DD); null when the plan year is open-ended
        premium_in_cents:
          type: integer
          description: Total monthly plan premium in cents
        employer_contribution_in_cents:
          type: integer
          description: Employer monthly contribution in cents
        employee_deduction_in_cents:
          type: integer
          description: Employee monthly payroll deduction in cents
        employee_deduction_frequency:
          allOf:
          - $ref: '#/components/schemas/DeductionFrequency'
          description: |-
            Cadence of the employee payroll deduction

            * `weekly` - Weekly
            * `bi_weekly` - Bi Weekly
            * `semi_monthly` - Semi Monthly
            * `monthly` - Monthly
        excess_employer_contribution_in_cents:
          type: integer
          nullable: true
          description: Employer contribution in excess of the premium, in cents; null when not applicable
        policy_holder_member_id:
          type: string
          readOnly: true
          description: Member id of the account holder who owns the coverage, with 'mbr_' prefix
        policy_holder_first_name:
          type: string
          description: First name of the account holder
        policy_holder_last_name:
          type: string
          description: Last name of the account holder
        covered_member_id:
          type: string
          readOnly: true
          description: Member id this coverage row applies to, with 'mbr_' prefix; may be the policy holder or one of their dependents, and may differ from the member id in the request path
        covered_member_first_name:
          type: string
          description: First name of the covered member
        covered_member_last_name:
          type: string
          description: Last name of the covered member
        is_dependent_coverage:
          type: boolean
          description: True when the covered member is a dependent rather than the policy holder
