  /v1/auth/access-tokens:
    post:
      operationId: issue_access_token
      description: Issues a short-lived access token from the authenticated API key. Access tokens can optionally be bound to a specific employer or employee for scoped access. Tokens expire after 15 minutes.
      summary: Issue access token
      tags:
      - Access Tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueAccessTokenRequest'
            examples:
              UnboundTokenRequest:
                value:
                  grant_type: client_credentials
                summary: Unbound Token Request
              Employer-BoundTokenRequest:
                value:
                  grant_type: client_credentials
                  bound_entity:
                    id: empr_SGVsbG8gV29ybGQ
                    type: employer
                summary: Employer-Bound Token Request
        required: true
      security:
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
              examples:
                AccessTokenResponse:
                  value:
                    access_token: vit_at_abc123def456...
                    token_type: Bearer
                    expires_in: 910
                    bound_entity:
                      id: empr_SGVsbG8gV29ybGQ
                      type: employer
                  summary: Access Token Response
          description: ''
          headers:
            X-RateLimit-Limit:
              description: Maximum number of requests allowed within the rate limit window
              schema:
                type: integer
                example: 1000
            X-RateLimit-Remaining:
              description: Number of requests remaining in the current rate limit window
              schema:
                type: integer
                example: 999
            X-RateLimit-Reset:
              description: Unix timestamp (seconds) when the rate limit window resets
              schema:
                type: integer
                example: 1700000000
