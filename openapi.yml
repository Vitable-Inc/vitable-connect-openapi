      enum:
      - Salary
      - Hourly
      type: string
      description: |-
        * `Salary` - Salary
        * `Hourly` - Hourly
    CreateBenefitEligibilityPolicyRequest:
      type: object
      properties:
        waiting_period:
          type: string
          description: 'Waiting period before eligibility. One of: first_of_following_month, 30_days, 60_days, none'
        classification:
          type: string
          description: 'Which employee classifications are eligible. One of: full_time, part_time, all'
      required:
      - classification
      - waiting_period
    CreateEmployerRequest:
      type: object
      properties:
        name:
          type: string
          description: Employer display name
          maxLength: 255
          minLength: 1
        legal_name:
          type: string
          description: Legal business name
          maxLength: 255
          minLength: 1
        ein:
          type: string
          description: 'Employer Identification Number (format: XX-XXXXXXX)'
          maxLength: 10
          minLength: 10
        email:
          type: string
          format: email
          description: Email address for billing and communications
        address:
          allOf:
          - $ref: '#/components/schemas/EmployerAddressInput'
          description: Employer address
        phone_number:
          type: string
          nullable: true
          description: Employer phone number (10-digit US format, e.g. 5551234567)
        reference_id:
          type: string
          nullable: true
          description: External reference ID for this employer
          maxLength: 255
      required:
      - address
      - ein
      - email
      - legal_name
      - name
    DeductionDetail:
      type: object
      properties:
        deduction_category:
          type: string
          nullable: true
          description: Deduction category (reserved for future use)
        deduction_amount_in_cents:
          type: integer
          description: Employee deduction amount in cents
        tax_classification:
          allOf:
          - $ref: '#/components/schemas/TaxClassification'
          description: |-
            Tax classification: Pre-tax, Post-tax, or Unknown

            * `Unknown` - Unknown
            * `Pre-tax` - Pre Tax
            * `Post-tax` - Post Tax
        frequency:
          allOf:
          - $ref: '#/components/schemas/Frequency'
          description: |-
            Deduction frequency

            * `weekly` - Weekly
            * `bi_weekly` - Bi Weekly
            * `semi_monthly` - Semi Monthly
            * `monthly` - Monthly
        benefit_name:
          type: string
          description: Name of the benefit plan
        period_start_date:
          type: string
          format: date
          description: Period start date (YYYY-MM-DD)
        period_end_date:
          type: string
          format: date
          description: Period end date (YYYY-MM-DD)
      required:
      - benefit_name
      - deduction_amount_in_cents
      - deduction_category
      - frequency
      - period_end_date
      - period_start_date
      - tax_classification
    Employee:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Unique employee identifier with 'empl_' prefix
        member_id:
          type: string
          readOnly: true
          description: Unique member identifier with 'mbr_' prefix
        reference_id:
          type: string
          nullable: true
