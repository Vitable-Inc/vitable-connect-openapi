              description: Number of requests remaining in the current rate limit window
              schema:
                type: integer
                example: 999
            X-RateLimit-Reset:
              description: Unix timestamp (seconds) when the rate limit window resets
              schema:
                type: integer
                example: 1700000000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error - An unexpected error occurred
          headers:
            X-RateLimit-Limit:
              description: Maximum number of requests allowed within the rate limit window
              schema:
                type: integer
                example: 1000
            X-RateLimit-Remaining:
              description: Number of requests remaining in the current rate limit window
              schema:
                type: integer
                example: 999
            X-RateLimit-Reset:
              description: Unix timestamp (seconds) when the rate limit window resets
              schema:
                type: integer
                example: 1700000000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Bad Gateway - External service error
          headers:
            X-RateLimit-Limit:
              description: Maximum number of requests allowed within the rate limit window
              schema:
                type: integer
                example: 1000
            X-RateLimit-Remaining:
              description: Number of requests remaining in the current rate limit window
              schema:
                type: integer
                example: 999
            X-RateLimit-Reset:
              description: Unix timestamp (seconds) when the rate limit window resets
              schema:
                type: integer
                example: 1700000000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AccessTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: The issued access token (vit_at_*)
        token_type:
          type: string
          description: Token type, always 'Bearer'
        expires_in:
          type: integer
          description: Token lifetime in seconds
        bound_entity:
          allOf:
          - $ref: '#/components/schemas/BoundEntityResponse'
          nullable: true
          description: Entity the token is bound to, if any
      required:
      - access_token
      - expires_in
      - token_type
    BenefitEligibilityPolicy:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        employer_id:
          type: string
          readOnly: true
        waiting_period:
          type: string
          readOnly: true
        classification:
          type: string
          readOnly: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - active
      - classification
      - created_at
      - employer_id
      - id
      - updated_at
      - waiting_period
    BenefitEligibilityPolicyResponse:
      type: object
      description: Response containing a single benefit eligibility policy resource.
      properties:
        data:
          $ref: '#/components/schemas/BenefitEligibilityPolicy'
      required:
      - data
    BenefitSummary:
      type: object
      properties:
        id:
          type: string
          description: Benefit product ID (bprd_*)
        name:
          type: string
          description: Display name of the benefit product
        product_code:
          allOf:
          - $ref: '#/components/schemas/ProductCode'
          description: |-
            Programmatic product identifier

            * `EBA` - Eba Mec
            * `VPC` - Vpc Enhanced
            * `VPC_CORE` - Vpc Core
            * `MEC` - Vpc Mec
            * `MEC2` - Mec2
            * `MEC_PLUS` - Mec Plus
            * `MVP` - Mvp
            * `MVP2` - Mvp2
            * `MVPSL` - Mvpsl
            * `MVPSL2` - Mvpsl2
            * `VD` - Dental
            * `VV` - Vision
            * `ICHRA` - Ichra
            * `ICHRA_PREMIUM_PLUS` - Ichra Premium Plus
            * `ICHRA_REIMBURSEMENT_ONLY` - Ichra Reimbursement Only
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          description: |-
            High-level benefit grouping

            * `Medical` - Medical
            * `Dental` - Dental
            * `Vision` - Vision
            * `Hospital` - Hospital
      required:
      - category
      - id
      - name
      - product_code
    BoundEntity:
      type: object
      properties:
        id:
          type: string
          description: Prefixed entity ID to bind the token to (empr_* for employer, empl_* for employee)
        type:
          allOf:
          - $ref: '#/components/schemas/Type'
          description: |-
            Type of entity: 'employer' or 'employee'

            * `employer` - employer
            * `employee` - employee
      required:
      - id
      - type
    BoundEntityResponse:
      type: object
      properties:
        id:
          type: string
          description: Prefixed entity ID the token is bound to (empr_* or empl_*)
        type:
          allOf:
          - $ref: '#/components/schemas/Type'
          description: |-
            Type of bound entity

            * `employer` - employer
            * `employee` - employee
      required:
      - id
      - type
    Category:
      enum:
      - Medical
      - Dental
      - Vision
      - Hospital
      type: string
      description: |-
        * `Medical` - Medical
        * `Dental` - Dental
        * `Vision` - Vision
        * `Hospital` - Hospital
    CensusSyncDetailResponse:
      type: object
      description: Response containing a single census sync detail resource.
      properties:
        data:
          $ref: '#/components/schemas/CensusSyncResponse'
