  /v1/benefit-products:
    get:
      operationId: list_benefit_products
      description: Retrieves a paginated list of all benefit products that the authenticated organization has access to and can offer to their employers. Use query parameters to filter by category, product code, or active status.
      summary: List benefit products
      parameters:
      - in: query
        name: active_in
        schema:
          $ref: '#/components/schemas/ActiveIn'
        description: Filter by active status
      - in: query
        name: category
        schema:
          $ref: '#/components/schemas/Category'
        description: Filter by product category
      - in: query
        name: limit
        schema:
          $ref: '#/components/schemas/Limit'
        description: 'Items per page (default: 20, max: 100)'
      - in: query
        name: page
        schema:
          $ref: '#/components/schemas/Page'
        description: 'Page number (default: 1)'
      - in: query
        name: product_code
        schema:
          $ref: '#/components/schemas/ProductCode'
        description: Filter by product code
      tags:
      - Benefit Products
      security:
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitProductListResponse'
              examples:
                BenefitProductsList:
                  value:
                    data:
                    - id: bprd_dental001
                      name: Delta Dental PPO
                      product_code: VD
                      description: Comprehensive dental coverage with a broad network of providers
                      category: Dental
                      carrier_name: Delta Dental
                      active_in: true
                      created_at: '2023-01-01T00:00:00Z'
                      updated_at: '2024-01-15T10:00:00Z'
                    - id: bprd_vision001
                      name: VSP Vision Care
                      product_code: VV
                      description: Vision coverage including annual exams and eyewear allowance
                      category: Vision
                      carrier_name: VSP
                      active_in: true
                      created_at: '2023-01-01T00:00:00Z'
                      updated_at: '2024-01-15T10:00:00Z'
                    - id: bprd_medical001
                      name: Vitable Primary Care
