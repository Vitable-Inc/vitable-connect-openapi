  /v1/auth/complete-profile:
    post:
      operationId: complete_profile
      description: 'Collects the required profile fields (first_name, last_name, phone) for a verified IdP identity and provisions the asclepius user: creates the BaseUser (of the app-context''s user_type, with the real phone) + the OrganizationUser persona (name). When a same-email account already exists (verified email) it links + finishes that account instead. Returns the auth session. Domain failures surface as the normalized error envelope with an `app_error_code`: 403 `email_verification_required`; 409 `identity_conflict` / `phone_in_use` / `needs_selection` (fetch candidates via `/personas`); 422 `invalid_phone`.'
      summary: Complete profile (provision the asclepius user)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompleteProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompleteProfileRequest'
        required: true
      security:
      - IdentityProviderBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
          headers:
            X-RateLimit-Limit:
              description: Maximum number of requests allowed within the rate limit window
              schema:
                type: integer
                example: 1000
            X-RateLimit-Remaining:
              description: Number of requests remaining in the current rate limit window
              schema:
