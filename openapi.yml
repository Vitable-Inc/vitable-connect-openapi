tags:
- name: Access Tokens
  description: Issue short-lived access tokens for scoped API access
- name: Employers
  description: Manage employer organizations that offer benefits to their employees
- name: Benefit Eligibility Policies
  description: Define rules that determine which employees qualify for benefits
- name: Benefit Products
  description: Browse available benefit products that can be offered to employers
- name: Plan Years
  description: Configure annual benefit periods with coverage dates and contribution settings
- name: Employees
  description: Manage employee records for employers
- name: Dependents
  description: Manage dependent records (spouses, children) for employees
- name: Qualifying Life Events
  description: Record life events that trigger special enrollment periods
- name: Enrollments
  description: Manage benefit enrollments and elections for employees
