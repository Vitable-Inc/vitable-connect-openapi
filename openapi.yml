        user_type:
          $ref: '#/components/schemas/UserType923'
        email_or_phone:
          type: string
        password:
          type: string
        two_factor_token:
          type: string
        app_name:
          type: string
        app_version:
          type: string
      required:
      - email_or_phone
      - user_type
