  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
      description: API Key or Access Token authentication using Bearer token in Authorization header. API keys use the vit_apk_ prefix, access tokens use the vit_at_ prefix.
    IdentityProviderBearer:
      type: http
      scheme: bearer
      description: IdP-issued bearer token (WorkOS or vitable). Forwarded to the identity endpoints; the auth class routes it by issuer, introspects it via IIdentityProvider, and hydrates request.user with the matching BaseUser — or AnonymousUser for a valid but not-yet-provisioned identity (the strict variant rejects that case).
servers:
- url: https://api.vitablehealth.com
  description: Production server
- url: https://api.uat.vitablehealth.com
  description: UAT server
tags:
- name: Access Tokens
  description: Issue short-lived access tokens for scoped API access
- name: Employers
  description: Manage employer organizations that offer benefits to their employees
- name: Benefit Products
  description: Browse available benefit products that can be offered to employers
- name: Plan Years
  description: Configure annual benefit periods with coverage dates and contribution settings
- name: Employees
  description: Manage employee records for employers
- name: Dependents
  description: Manage dependent records (spouses, children) for employees
- name: Qualifying Life Events
  description: Record life events that trigger special enrollment periods
- name: Enrollments
  description: Manage benefit enrollments and elections for employees
security:
- APIKeyAuth: []
