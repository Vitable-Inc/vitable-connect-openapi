  /v1/employers/{employer_id}/benefit-eligibility-policies:
    post:
      operationId: create_benefit_eligibility_policy
      description: Creates a new benefit eligibility policy for a specific employer. Eligibility policies define rules that determine which employees qualify for benefits based on criteria such as employment status (full-time, part-time), hours worked per week, waiting periods after hire date, or other custom requirements. Optionally provide 'policy_to_replace_id' as a query parameter to replace an existing policy.
      summary: Create eligibility policy
      parameters:
      - in: path
        name: employer_id
        schema:
          $ref: '#/components/schemas/EmployerId'
        description: Unique employer identifier (empr_*)
        required: true
      - in: query
        name: policy_to_replace_id
        schema:
          $ref: '#/components/schemas/PolicyToReplaceId'
        description: ID of existing policy to replace (epol_*)
      tags:
      - Benefit Eligibility Policies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBenefitEligibilityPolicyRequest'
            examples:
              CreateEligibilityPolicyRequest:
                value:
                  name: Standard Full-Time Eligibility
                  description: Eligibility policy for full-time employees working 30+ hours per week
                  rules:
                  - rule_type: employment_status
                    operator: in
                    value: full_time,part_time_30_plus
                  - rule_type: waiting_period_days
                    operator: greater_than_or_equal
                    value: '30'
                  effective_date: '2025-01-01'
                summary: Create Eligibility Policy Request
        required: true
      security:
      - APIKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitEligibilityPolicyResponse'
              examples:
                CreatedEligibilityPolicyResponse:
                  value:
                    data:
                      id: epol_new456def
                      employer_id: empr_abc123
                      name: Standard Full-Time Eligibility
                      description: Eligibility policy for full-time employees working 30+ hours per week
                      rules:
                      - rule_type: employment_status
                        operator: in
                        value:
                        - full_time
                        - part_time_30_plus
                      - rule_type: waiting_period_days
                        operator: greater_than_or_equal
                        value: 30
                      effective_date: '2025-01-01'
                      replaced_policy_id: null
