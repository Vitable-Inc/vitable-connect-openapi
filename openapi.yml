  /v1/employees/{employee_id}/enrollments:
    get:
      operationId: list_enrollments
      description: Retrieves a paginated list of benefit enrollments for an employee.
      summary: List employee enrollments
      parameters:
      - in: path
        name: employee_id
        schema:
          $ref: '#/components/schemas/EmployeeId'
        description: Unique employee identifier (empl_*)
        required: true
      - in: query
        name: limit
        schema:
          $ref: '#/components/schemas/Limit'
        description: 'Items per page (default: 20, max: 100)'
      - in: query
        name: page
        schema:
          $ref: '#/components/schemas/Page'
        description: 'Page number (default: 1)'
      tags:
      - Enrollments
      security:
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListResponse'
              examples:
                EnrollmentsList:
                  value:
                    data:
                    - id: enrl_abc123def456
                      employee_id: empl_xyz789ghi012
                      employer_id: empr_def456ghi789
                      benefit:
