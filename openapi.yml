          description: Benefit plan-year coverage end date (YYYY-MM-DD), distinct from this enrollment's coverage_end; null when the plan year is open-ended
        issued_date:
          type: string
          format: date
          description: Date the enrollment record was created (YYYY-MM-DD), the value Ops labels Issued on. Present on every row whatever the member answered, and distinct from `coverage_start`. It does not imply the member could answer the enrollment on that date; the window they can answer in is `enrollment_window_start`/`enrollment_window_end`.
        enrollment_window_start:
          type: string
          format: date
          description: Enrollment / open-enrollment window start date (YYYY-MM-DD)
        enrollment_window_end:
          type: string
          format: date
          nullable: true
          description: Enrollment / open-enrollment window end date (YYYY-MM-DD); null when open-ended
        election_status:
          allOf:
          - $ref: '#/components/schemas/PlanYearEnrollmentElectionStatus'
          description: |-
            Where the member stands: `Enrolled` or `Waived` if they answered, otherwise `Pending` while their enrollment window is open and `Expired` once it has closed.

            * `Enrolled` - Enrolled
            * `Waived` - Waived
            * `Pending` - Pending
            * `Expired` - Expired
        policy_status:
          allOf:
          - $ref: '#/components/schemas/PlanYearEnrollmentPolicyStatus'
          nullable: true
          description: |-
            Where the member's coverage stands: `Coverage Upcoming`, `Coverage Effective`, `Coverage Ended`, or `Cancelled`. Null unless the member enrolled.

            * `Coverage Upcoming` - Coverage Upcoming
            * `Coverage Effective` - Coverage Effective
            * `Coverage Ended` - Coverage Ended
            * `Cancelled` - Cancelled
        in_last_month_of_coverage:
          type: boolean
          description: True when today falls in the final month of the plan-year coverage window; drives end-of-coverage enrollment actions on the client.
        is_within_enrollment_window:
          type: boolean
          description: True when today falls inside the enrollment window this member has to answer in; drives enrollment-action availability on the client.
        ichra_affordability:
          allOf:
          - $ref: '#/components/schemas/IchraAffordability'
          nullable: true
          description: How this member's monthly share compares with the ACA affordability line for their income. Null unless the row is an ICHRA election whose plan year, premium and the member's individual income are all on file.
      required:
      - benefit_plan_year_id
      - benefit_type
      - cancelled_date
      - election_status
      - employer_id
      - employer_name
      - enrollment_window_start
      - ichra_affordability
      - id
      - in_last_month_of_coverage
      - is_within_enrollment_window
      - issued_date
      - plan_year_coverage_end
      - policy_status
      - product_code
      - product_name
      - requires_qle_for_reissue
