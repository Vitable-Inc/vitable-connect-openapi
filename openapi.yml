components:
  schemas:
    AccessTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: The issued access token (vit_at_*)
        token_type:
          type: string
          description: Token type, always 'Bearer'
        expires_in:
          type: integer
          description: Token lifetime in seconds
        bound_entity:
          allOf:
          - $ref: '#/components/schemas/BoundEntityResponse'
          nullable: true
          description: Entity the token is bound to, if any
      required:
      - access_token
      - expires_in
      - token_type
    AddressRequest:
      type: object
      properties:
        address_line_1:
          type: string
          maxLength: 255
          minLength: 1
        address_line_2:
          type: string
          nullable: true
          maxLength: 255
        city:
          type: string
          maxLength: 255
          minLength: 1
        state:
          type: string
          maxLength: 2
          minLength: 2
        zipcode:
          type: string
          maxLength: 20
          minLength: 1
      required:
      - address_line_1
      - city
      - state
      - zipcode
    AuthSession:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
      required:
      - user
    AuthUser:
      type: object
      properties:
        base_user_id:
          type: string
        email:
          type: string
        user_type:
          $ref: '#/components/schemas/UserType'
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        idp_provider:
          $ref: '#/components/schemas/IdpProvider'
        idp_user_id:
          type: string
        phone:
          type: string
          nullable: true
      required:
      - base_user_id
      - email
      - first_name
      - idp_provider
      - idp_user_id
      - last_name
      - phone
      - user_type
    BenefitSummary:
      type: object
      properties:
        id:
          type: string
          description: Benefit product ID (bprd_*)
        name:
          type: string
          description: Display name of the benefit product
        product_code:
          allOf:
          - $ref: '#/components/schemas/ProductCode'
          description: |-
            Programmatic product identifier

            * `EBA` - Eba Mec
            * `VPC` - Vpc Enhanced
            * `VPC_CORE` - Vpc Core
            * `MEC` - Vpc Mec
            * `MEC2` - Mec2
            * `MEC_PLUS` - Mec Plus
            * `MVP` - Mvp
            * `MVP2` - Mvp2
            * `MVPSL` - Mvpsl
            * `MVPSL2` - Mvpsl2
            * `VD` - Dental
            * `VV` - Vision
            * `ICHRA` - Ichra
            * `ICHRA_PREMIUM_PLUS` - Ichra Premium Plus
            * `ICHRA_REIMBURSEMENT_ONLY` - Ichra Reimbursement Only
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          description: |-
            High-level benefit grouping

            * `Medical` - Medical
            * `Dental` - Dental
            * `Vision` - Vision
            * `Hospital` - Hospital
      required:
      - category
      - id
      - name
      - product_code
    BoundEntity:
      type: object
      properties:
        id:
          type: string
          description: Prefixed entity ID to bind the token to (empr_* for employer, empl_* for employee)
        type:
          allOf:
          - $ref: '#/components/schemas/Type16f'
          description: |-
            Type of entity: 'employer' or 'employee'

            * `employer` - employer
            * `employee` - employee
      required:
      - id
      - type
    BoundEntityResponse:
      type: object
      properties:
        id:
          type: string
          description: Prefixed entity ID the token is bound to (empr_* or empl_*)
        type:
          allOf:
          - $ref: '#/components/schemas/Type16f'
          description: |-
            Type of bound entity

            * `employer` - employer
            * `employee` - employee
      required:
      - id
      - type
    Category:
      enum:
      - Medical
      - Dental
      - Vision
      - Hospital
      type: string
      description: |-
        * `Medical` - Medical
        * `Dental` - Dental
        * `Vision` - Vision
        * `Hospital` - Hospital
    CensusSyncDetailResponse:
      type: object
      description: Response containing a single census sync detail resource.
      properties:
        data:
          $ref: '#/components/schemas/CensusSyncResponse'
      required:
      - data
    CensusSyncEmployeeAddressRequest:
      type: object
      properties:
        address_line_1:
          type: string
          maxLength: 255
        address_line_2:
          type: string
          nullable: true
          maxLength: 255
        city:
          type: string
          maxLength: 255
        state:
          $ref: '#/components/schemas/State'
        zipcode:
          type: string
          maxLength: 10
      required:
      - address_line_1
      - city
      - state
      - zipcode
    CensusSyncEmployeeRequest:
      type: object
      properties:
        reference_id:
          type: string
          nullable: true
          maxLength: 255
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
        date_of_birth:
          type: string
          format: date
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          allOf:
          - $ref: '#/components/schemas/CensusSyncEmployeeAddressRequest'
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        employee_class:
          allOf:
          - $ref: '#/components/schemas/EmployeeClass'
          nullable: true
        compensation_type:
          allOf:
          - $ref: '#/components/schemas/CompensationType'
          nullable: true
      required:
      - date_of_birth
      - email
      - first_name
      - last_name
      - phone
    CensusSyncRequest:
      type: object
      properties:
        employees:
          type: array
          items:
            $ref: '#/components/schemas/CensusSyncEmployeeRequest'
          maxItems: 5000
          minItems: 1
      required:
      - employees
    CensusSyncResponse:
      type: object
      properties:
        employer_id:
          type: string
        accepted_at:
          type: string
          format: date-time
      required:
      - accepted_at
      - employer_id
    CompensationType:
      enum:
      - Salary
      - Hourly
      type: string
      description: |-
        * `Salary` - Salary
        * `Hourly` - Hourly
    CompleteProfileRequest:
      type: object
      description: |-
        Profile fields collected to provision (or finish linking) the asclepius user.

        Deliberately NO `user_type`: the provisioning target is derived from the app-context's
        single allowed user_type (no client-chosen persona). Phone format is validated in the
        domain (`PhoneNumber`), which raises `invalid_phone` (422) on a bad value.
      properties:
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
      required:
      - first_name
      - last_name
      - phone
    CreateEmployerRequest:
      type: object
      properties:
        name:
          type: string
          description: Employer display name
          maxLength: 255
          minLength: 1
        legal_name:
          type: string
          description: Legal business name
          maxLength: 255
          minLength: 1
        ein:
          type: string
          description: 'Employer Identification Number (format: XX-XXXXXXX)'
          maxLength: 10
          minLength: 10
        email:
          type: string
          format: email
          description: Email address for billing and communications
        address:
          allOf:
          - $ref: '#/components/schemas/EmployerAddressInput'
          description: Employer address
        phone_number:
          type: string
          nullable: true
          description: Employer phone number (10-digit US format, e.g. 5551234567)
        reference_id:
          type: string
          nullable: true
          description: External reference ID for this employer
          maxLength: 255
      required:
      - address
      - ein
      - email
      - legal_name
      - name
    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
        external_reference_id:
          type: string
          maxLength: 255
          minLength: 1
      required:
      - external_reference_id
      - name
    CreateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
        type:
          allOf:
          - $ref: '#/components/schemas/CreateOrganizationRequestType'
          nullable: true
      required:
      - name
    CreateOrganizationRequestType:
      enum:
      - BROKERAGE
      - TPA
      - GENERAL_AGENT
      - CHANNEL_PARTNER
      - CONSULTING_FIRM
      - API_PLATFORM
      type: string
      description: |-
        * `BROKERAGE` - BROKERAGE
        * `TPA` - TPA
        * `GENERAL_AGENT` - GENERAL_AGENT
        * `CHANNEL_PARTNER` - CHANNEL_PARTNER
        * `CONSULTING_FIRM` - CONSULTING_FIRM
        * `API_PLATFORM` - API_PLATFORM
    DeductionDetail:
      type: object
      properties:
        deduction_category:
          type: string
          nullable: true
          description: Deduction category (reserved for future use)
        deduction_amount_in_cents:
          type: integer
          description: Employee deduction amount in cents
        tax_classification:
          allOf:
          - $ref: '#/components/schemas/TaxClassification'
          description: |-
            Tax classification: Pre-tax, Post-tax, or Unknown

            * `Unknown` - Unknown
            * `Pre-tax` - Pre Tax
            * `Post-tax` - Post Tax
        frequency:
          allOf:
          - $ref: '#/components/schemas/Frequency'
          description: |-
            Deduction frequency

            * `weekly` - Weekly
            * `bi_weekly` - Bi Weekly
            * `semi_monthly` - Semi Monthly
            * `monthly` - Monthly
        benefit_name:
          type: string
          description: Name of the benefit plan
        period_start_date:
          type: string
          format: date
          description: Period start date (YYYY-MM-DD)
        period_end_date:
          type: string
          format: date
          description: Period end date (YYYY-MM-DD)
      required:
      - benefit_name
      - deduction_amount_in_cents
      - deduction_category
      - frequency
      - period_end_date
      - period_start_date
      - tax_classification
    Employee:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Unique employee identifier with 'empl_' prefix
        member_id:
          type: string
          readOnly: true
          description: Unique member identifier with 'mbr_' prefix
        reference_id:
          type: string
          nullable: true
          description: Partner-assigned reference ID for the employee
        first_name:
          type: string
          description: Employee's legal first name
        last_name:
          type: string
          description: Employee's legal last name
        suffix:
          type: string
          nullable: true
          description: Name suffix (e.g., Jr., Sr., III)
        email:
          type: string
          format: email
          description: Email address
        date_of_birth:
          type: string
          format: date
