                      benefit_product_id: bprd_dental001
                      employer_id: empr_abc123
                      coverage_start: '2025-01-01'
                      coverage_end: '2025-12-31'
                      open_enrollment_start_date: '2024-10-01'
                      open_enrollment_end_date: '2024-11-15'
                      status: active
                      plans: []
                      contribution_classes:
                      - id: cc_0
