  /v1/members/{member_id}/enrollments:
    get:
      operationId: list_member_enrollments
      description: 'Lists a member''s benefit enrollments across every employer — benefit type and product, employer, carrier, plan, tier, employee deduction, employer contribution and total premium, the individual enrollment coverage boundary (`coverage_end`), the separate pre-effective cancellation boundary (`cancelled_date`), and the distinct benefit plan-year boundary (`plan_year_coverage_end`) used to determine whether the plan year itself has ended, the date the enrollment record was created (`issued_date`, the value Ops labels Issued on, reported for every row whatever the member answered), whether a qualifying life event would currently be required for reissue under the product/open-enrollment rule, enrollment/open-enrollment window, and two statuses: `election_status` (what the member answered) and `policy_status` (what became of their coverage, null unless they enrolled). Every row includes a stable enrollment ID and the exact employer and benefit plan-year IDs used to fetch that row''s plan-year detail. The full list is returned across all states so the client derives active plans (effective and upcoming) and the enrollment history from those per-row statuses. For an organization caller the rows are scoped to companies in that organization''s book; a member (self/household) or Vitable Admin sees all enrollments. A member not visible to the caller returns a 404.'
      summary: List member enrollments
      parameters:
      - in: path
        name: member_id
        schema:
          $ref: '#/components/schemas/MemberId'
        required: true
      tags:
      - Members
      security:
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberEnrollmentsResponse'
              examples:
                MemberEnrollments:
                  value:
                    data:
                    - id: enrl_AAAAAAAAAAAAAAAAAAAAAQ
                      employer_id: empr_AAAAAAAAAAAAAAAAAAAAAQ
                      benefit_plan_year_id: plyr_AAAAAAAAAAAAAAAAAAAAAQ
                      benefit_type: Medical
                      product_code: MEC_PLUS
                      requires_qle_for_reissue: false
                      product_name: MEC Plus
                      employer_name: Acme Corp
                      carrier_name: Vitable
                      plan_name: MEC Plus Standard
                      tier_name: Employee Only
                      employee_deduction_in_cents: 5000
                      employer_contribution_in_cents: 25000
                      premium_in_cents: 30000
