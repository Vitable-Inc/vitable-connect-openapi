    put:
      operationId: update_plan_year
      description: 'Updates an existing plan year''s configuration. Important: Plan years can only be edited until open enrollment starts. All fields are optional. Monetary values must be in cents.'
      summary: Update plan year configuration
      parameters:
      - in: path
        name: plan_year_id
