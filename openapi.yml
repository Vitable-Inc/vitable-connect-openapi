  /v1/webhook-events:
    get:
      operationId: list_webhook_events
      description: Retrieves a paginated list of webhook events for the authenticated organization. Supports filtering by event name, resource type, resource ID, and date range.
      summary: List webhook events
      parameters:
      - in: query
        name: created_after
        schema:
          $ref: '#/components/schemas/CreatedAfter'
      - in: query
        name: created_before
        schema:
          $ref: '#/components/schemas/CreatedBefore'
      - in: query
        name: event_name
        schema:
          $ref: '#/components/schemas/EventName'
        description: |-
          * `enrollment.accepted` - Enrollment Accepted
          * `enrollment.terminated` - Enrollment Terminated
          * `enrollment.termination_rescheduled` - Enrollment Termination Rescheduled
          * `enrollment.elected` - Enrollment Elected
          * `enrollment.granted` - Enrollment Granted
          * `enrollment.waived` - Enrollment Waived
          * `enrollment.started` - Enrollment Started
          * `employee.eligibility_granted` - Employee Eligibility Granted
          * `employee.eligibility_terminated` - Employee Eligibility Terminated
          * `employee.deactivated` - Employee Deactivated
          * `employee.deduction_created` - Employee Deduction Created
      - in: query
        name: limit
        schema:
          $ref: '#/components/schemas/Limit'
      - in: query
        name: page
        schema:
          $ref: '#/components/schemas/Page'
      - in: query
        name: resource_id
        schema:
          $ref: '#/components/schemas/ResourceId'
      - in: query
        name: resource_type
        schema:
          $ref: '#/components/schemas/ResourceType'
        description: |-
          * `enrollment` - Enrollment
          * `employee` - Employee
          * `employer` - Employer
          * `dependent` - Dependent
          * `plan_year` - Plan Year
          * `payroll_deduction` - Payroll Deduction
      tags:
      - Outbound Webhooks
      security:
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEventListResponse'
              examples:
                WebhookEventsList:
                  value:
                    data:
                    - id: wevt_abc123def456
                      organization_id: org_xyz789
                      event_name: enrollment.accepted
