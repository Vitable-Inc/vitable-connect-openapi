  /v1/employers:
    get:
      operationId: list_employers
      description: 'Returns the caller''s employer book — every employer with its computed columns (enrollment-rate summary, benefit-family tags, HRIS connection, benefit-lifecycle stage) merged with the employer''s flat CRM fields (legal name, EIN, contact, address, timestamps). The book is derived from the authenticated principal: one organization''s employers, or every organization''s for a caller whose reach is not a single organization. Supports search by display name, legal name, or exact EIN, employer id or contact email, benefit-family/lifecycle/HRIS filters, and page/limit pagination.'
      summary: List employers
      parameters:
      - in: query
        name: benefit_family
        schema:
          $ref: '#/components/schemas/BenefitFamilyParam'
        description: Filter to employers with at least one active benefit in these families.
      - in: query
        name: benefit_lifecycle_stage
        schema:
          $ref: '#/components/schemas/BenefitLifecycleStage'
        description: Filter to employers in one of these computed benefit-lifecycle stages.
      - in: query
        name: hris_provider
        schema:
          $ref: '#/components/schemas/HrisProvider'
        description: Filter to employers whose HRIS connection is with one of these payroll providers (e.g. `ADP RUN`). Matched case-insensitively; free text, so read the available values from the HRIS-providers endpoint rather than assuming a fixed set.
      - in: query
        name: hris_status
        schema:
          $ref: '#/components/schemas/HrisStatus'
        description: Filter to employers whose HRIS connection is in one of these statuses.
      - in: query
        name: include_cancelled
        schema:
          $ref: '#/components/schemas/IncludeCancelled'
        description: Include cancelled employers (hidden by default unless their stage is explicitly requested).
      - in: query
        name: limit
        schema:
          $ref: '#/components/schemas/Limit'
        description: Items per page.
      - in: query
        name: page
        schema:
          $ref: '#/components/schemas/Page'
        description: Page number.
      - in: query
        name: search
        schema:
          $ref: '#/components/schemas/Search'
        description: 'Employer filter. Matches the display name or the legal name case-insensitively as a substring, or one of these exactly: the EIN (with or without its dash), the employer id, or the contact email of one of the employer''s non-disabled admins.'
